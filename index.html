<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Гистология | умный тест</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <div class="site-header">
                <div class="logo">
                    <span class="icon">🧬</span>
                    <span>Гистология</span>
                </div>
                <div class="nav">
                    <button id="historyBtn" class="nav-btn">📊 История</button>
                </div>
            </div>

            <div class="hero" id="heroArea">
                <h1>Гистология: тренировка знаний</h1>
                <p>299 вопросов, 25 случайных заданий, 30 секунд на ответ. Умная система повторений + работа над ошибками.</p>
                <button id="startTestBtn" class="btn btn-primary start-btn">⚡ Начать тест</button>
                <div class="daily-quote" id="dailyQuote"></div>
            </div>

            <div id="quizArea" style="display: none;">
                <div class="timer-area">
                    <div class="timer-ring">
                        <svg width="70" height="70" viewBox="0 0 70 70">
                            <circle class="track" cx="35" cy="35" r="30" stroke-width="4" fill="none"/>
                            <circle class="fill" cx="35" cy="35" r="30" stroke-width="4" fill="none" stroke-dasharray="188.5" stroke-dashoffset="0"/>
                        </svg>
                        <div class="timer-num" id="timerSeconds">30</div>
                    </div>
                </div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <div class="quiz-card" id="quizCard">
                    <div class="question-number" id="qNum">ВОПРОС 1/25</div>
                    <div class="question-text" id="qText"></div>
                    <div class="answers-list" id="answersContainer"></div>
                </div>
            </div>

            <div id="resultArea" style="display: none;" class="quiz-card result-card"></div>
        </div>
    </div>

    <div class="footer-author" id="footerMessage">
        Гистология · тест-тренажёр · авторский дизайн
    </div>

    <button id="floatingExitBtn" class="floating-exit" style="display:none;">✖</button>

    <div id="exitModal" class="modal">
        <div class="modal-content">
            <h3>Прервать сессию?</h3>
            <p>Прогресс будет утерян.</p>
            <div class="modal-buttons">
                <button class="btn" id="cancelExitBtn">Отмена</button>
                <button class="btn btn-primary" id="confirmExitBtn">Выйти</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <h3>📋 История попыток</h3>
            <div id="historyList" class="history-list"></div>
            <button class="btn" id="closeHistoryBtn">Закрыть</button>
        </div>
    </div>

    <div id="errorsModal" class="modal">
        <div class="modal-content">
            <h3>❌ Детальный разбор ошибок</h3>
            <div id="errorsDetailedList" class="errors-list"></div>
            <button class="btn btn-primary" id="closeErrorsBtn">Закрыть</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
